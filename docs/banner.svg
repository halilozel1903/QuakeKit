<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121c"/>
      <stop offset="1" stop-color="#271a20"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="1" stop-color="#14202d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d7263d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d7263d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="700" y="120" width="480" height="340" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- seismograph trace across the bottom -->
  <path d="M0 560 H180 l10 -8 l10 14 l10 -26 l10 44 l10 -62 l12 86 l10 -70 l10 40 l10 -24 l10 12 l10 -6 H520 l8 -4 l8 6 H1280"
        fill="none" stroke="#f2733a" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>

  <!-- title block -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <g transform="translate(80 150)">
      <circle cx="30" cy="30" r="30" fill="#f2733a"/>
      <circle cx="30" cy="30" r="12" fill="#14121c"/>
      <circle cx="30" cy="30" r="21" fill="none" stroke="#14121c" stroke-width="3"/>
    </g>
    <text x="160" y="200" font-size="68" font-weight="700" fill="#ffffff">QuakeKit</text>
    <text x="82" y="262" font-size="27" fill="#d9d4dd">Live USGS earthquakes for Swift:</text>
    <text x="82" y="298" font-size="27" fill="#d9d4dd">feeds, catalog search and event detail,</text>
    <text x="82" y="334" font-size="27" fill="#d9d4dd">with an iPad and Mac map app.</text>

    <g font-size="18" font-weight="600">
      <rect x="82" y="378" width="190" height="40" rx="20" fill="#f2733a" fill-opacity="0.18" stroke="#f2733a" stroke-opacity="0.6"/>
      <text x="177" y="404" text-anchor="middle" fill="#ffb48a">Summary feeds</text>
      <rect x="286" y="378" width="160" height="40" rx="20" fill="#f2d338" fill-opacity="0.15" stroke="#f2d338" stroke-opacity="0.6"/>
      <text x="366" y="404" text-anchor="middle" fill="#f6e48c">FDSN query</text>
      <rect x="460" y="378" width="160" height="40" rx="20" fill="#5fb8a8" fill-opacity="0.16" stroke="#5fb8a8" stroke-opacity="0.6"/>
      <text x="540" y="404" text-anchor="middle" fill="#9fe0d4">PAGER alerts</text>
      <rect x="82" y="432" width="190" height="40" rx="20" fill="#a51c5e" fill-opacity="0.2" stroke="#d75a92" stroke-opacity="0.6"/>
      <text x="177" y="458" text-anchor="middle" fill="#f0a6c8">Magnitude scale</text>
      <rect x="286" y="432" width="140" height="40" rx="20" fill="#3d7af2" fill-opacity="0.16" stroke="#6f9cf5" stroke-opacity="0.6"/>
      <text x="356" y="458" text-anchor="middle" fill="#b2c9fa">MapKit app</text>
      <rect x="440" y="432" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.6"/>
      <text x="530" y="458" text-anchor="middle" fill="#e6e1ea">iPadOS · macOS</text>
    </g>
  </g>

  <!-- device: an abstract Mac window with sidebar, list and map -->
  <rect x="680" y="96" width="520" height="384" rx="22" fill="#0c0b10" stroke="#3a3440" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="700" y="120" width="480" height="340" fill="url(#sea)"/>
    <!-- land masses, abstract -->
    <path d="M880 150 q40 -20 80 0 q30 18 20 50 q-12 30 -50 36 q-40 4 -56 -24 q-14 -34 6 -62z" fill="#2a3a4a"/>
    <path d="M1010 230 q50 -30 110 -6 q40 20 30 70 q-10 48 -70 60 q-60 8 -86 -40 q-20 -46 16 -84z" fill="#2a3a4a"/>
    <path d="M920 330 q30 -12 54 6 q20 20 4 48 q-20 26 -50 14 q-26 -16 -8 -68z" fill="#2a3a4a"/>
    <!-- sidebar and list -->
    <rect x="700" y="120" width="70" height="340" fill="#1d1a22"/>
    <rect x="712" y="140" width="46" height="10" rx="5" fill="#f2733a"/>
    <rect x="712" y="162" width="40" height="8" rx="4" fill="#4a4450"/>
    <rect x="712" y="180" width="44" height="8" rx="4" fill="#4a4450"/>
    <rect x="712" y="198" width="36" height="8" rx="4" fill="#4a4450"/>
    <rect x="770" y="120" width="96" height="340" fill="#17151b"/>
    <g>
      <rect x="780" y="136" width="22" height="22" rx="5" fill="#d7263d"/>
      <rect x="808" y="140" width="48" height="6" rx="3" fill="#5a5360"/>
      <rect x="808" y="150" width="32" height="5" rx="2.5" fill="#3a3440"/>
      <rect x="780" y="170" width="22" height="22" rx="5" fill="#ec6a2e"/>
      <rect x="808" y="174" width="44" height="6" rx="3" fill="#5a5360"/>
      <rect x="808" y="184" width="30" height="5" rx="2.5" fill="#3a3440"/>
      <rect x="780" y="204" width="22" height="22" rx="5" fill="#f6a13a"/>
      <rect x="808" y="208" width="46" height="6" rx="3" fill="#5a5360"/>
      <rect x="808" y="218" width="28" height="5" rx="2.5" fill="#3a3440"/>
      <rect x="780" y="238" width="22" height="22" rx="5" fill="#f2d338"/>
      <rect x="808" y="242" width="40" height="6" rx="3" fill="#5a5360"/>
      <rect x="808" y="252" width="34" height="5" rx="2.5" fill="#3a3440"/>
      <rect x="780" y="272" width="22" height="22" rx="5" fill="#9ccb5b"/>
      <rect x="808" y="276" width="42" height="6" rx="3" fill="#5a5360"/>
      <rect x="808" y="286" width="26" height="5" rx="2.5" fill="#3a3440"/>
    </g>
    <!-- quake circles -->
    <circle cx="1052" cy="262" r="70" fill="url(#glow)"/>
    <circle cx="1052" cy="262" r="26" fill="#d7263d" fill-opacity="0.8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1052" cy="262" r="40" fill="none" stroke="#d7263d" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="930" cy="214" r="15" fill="#ec6a2e" fill-opacity="0.7"/>
    <circle cx="968" cy="380" r="11" fill="#f6a13a" fill-opacity="0.7"/>
    <circle cx="1120" cy="340" r="9" fill="#f2d338" fill-opacity="0.7"/>
    <circle cx="900" cy="300" r="7" fill="#9ccb5b" fill-opacity="0.75"/>
    <circle cx="1140" cy="180" r="12" fill="#f6a13a" fill-opacity="0.7"/>
    <circle cx="1000" cy="160" r="6" fill="#5fb8a8" fill-opacity="0.8"/>
    <circle cx="1090" cy="410" r="8" fill="#9ccb5b" fill-opacity="0.75"/>
    <circle cx="890" cy="420" r="5" fill="#5fb8a8" fill-opacity="0.8"/>
    <circle cx="1160" cy="260" r="6" fill="#f2d338" fill-opacity="0.75"/>
  </g>
  <rect x="860" y="480" width="160" height="16" rx="4" fill="#2a2630"/>
  <rect x="820" y="494" width="240" height="10" rx="5" fill="#3a3440"/>

  <!-- device: an abstract iPad with a detail panel -->
  <rect x="1060" y="300" width="190" height="260" rx="20" fill="#0c0b10" stroke="#4a4450" stroke-width="2"/>
  <rect x="1072" y="312" width="166" height="236" rx="10" fill="#1b2a3a"/>
  <circle cx="1130" cy="370" r="16" fill="#a51c5e" fill-opacity="0.8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1196" cy="344" r="7" fill="#f6a13a" fill-opacity="0.75"/>
  <circle cx="1100" cy="330" r="5" fill="#9ccb5b" fill-opacity="0.8"/>
  <rect x="1080" y="412" width="150" height="128" rx="10" fill="#1d1a22"/>
  <rect x="1090" y="424" width="30" height="30" rx="7" fill="#a51c5e"/>
  <rect x="1128" y="428" width="90" height="7" rx="3.5" fill="#6a6370"/>
  <rect x="1128" y="441" width="60" height="6" rx="3" fill="#4a4450"/>
  <rect x="1090" y="464" width="60" height="22" rx="11" fill="#f2c200" fill-opacity="0.3"/>
  <rect x="1156" y="464" width="62" height="22" rx="11" fill="#22b8cf" fill-opacity="0.3"/>
  <rect x="1090" y="494" width="62" height="36" rx="6" fill="#2a2630"/>
  <rect x="1158" y="494" width="62" height="36" rx="6" fill="#2a2630"/>
</svg>
