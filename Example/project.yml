name: QuakeWatch
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  QuakeKit:
    path: ..
targets:
  QuakeWatch:
    type: application
    platform: iOS
    sources:
      - Shared
      - iPad
    dependencies:
      - package: QuakeKit
        product: QuakeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.QuakeWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quake Watch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
  QuakeWatchMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    dependencies:
      - package: QuakeKit
        product: QuakeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.QuakeWatchMac
        PRODUCT_NAME: QuakeWatchMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quake Watch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Halil Özel"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
schemes:
  QuakeWatch:
    build:
      targets:
        QuakeWatch: all
    run:
      config: Debug
  QuakeWatchMac:
    build:
      targets:
        QuakeWatchMac: all
    run:
      config: Debug
